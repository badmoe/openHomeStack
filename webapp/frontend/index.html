<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openHomeStack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1><i class="fas fa-layer-group"></i> openHomeStack</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary btn-add-service-header" onclick="showAddServiceModal()">
                    <i class="fas fa-plus"></i> Add Service
                </button>
                <div class="system-info" id="systemInfo">
                    <div class="stat">
                        <i class="fas fa-microchip"></i>
                        <span id="cpuUsage">--</span>
                    </div>
                    <div class="stat">
                        <i class="fas fa-memory"></i>
                        <span id="memUsage">--</span>
                    </div>
                    <div class="stat">
                        <i class="fas fa-hdd"></i>
                        <span id="diskUsage">--</span>
                    </div>
                    <div class="stat">
                        <i class="fas fa-cube"></i>
                        <span id="containerCount">--</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Category Filter -->
        <div class="filter-bar">
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">All</button>
                <button class="tab-btn" data-category="media">Media</button>
                <button class="tab-btn" data-category="dns">DNS</button>
                <button class="tab-btn" data-category="networking">Networking</button>
                <button class="tab-btn" data-category="automation">Automation</button>
                <button class="tab-btn" data-category="management">Management</button>
            </div>
        </div>

        <!-- Services Table -->
        <div class="table-container">
            <table class="services-table" id="servicesTable">
                <thead>
                    <tr>
                        <th class="col-service">Service</th>
                        <th class="col-status">Status</th>
                        <th class="col-category">Category</th>
                        <th class="col-description">Description</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="servicesBody">
                    <tr>
                        <td colspan="5" class="loading-cell">
                            <i class="fas fa-spinner fa-spin"></i> Loading services...
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Add Service Button (bottom) -->
            <button class="btn btn-add-service-bottom" onclick="showAddServiceModal()">
                <i class="fas fa-plus"></i> Add Service
            </button>
        </div>

        <!-- Install Modal -->
        <div id="installModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Install Service</h2>
                    <span class="close" onclick="closeInstallModal()">&times;</span>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeInstallModal()">Cancel</button>
                    <button class="btn btn-primary" id="installBtn" onclick="confirmInstall()">Install</button>
                </div>
            </div>
        </div>

        <!-- Add Service Wizard Modal -->
        <div id="addServiceModal" class="modal">
            <div class="modal-content add-service-modal">
                <div class="modal-header">
                    <h2 id="wizardTitle">Add Service</h2>
                    <span class="close" onclick="closeAddServiceModal()">&times;</span>
                </div>
                <div class="wizard-steps">
                    <div class="wizard-step active" data-step="1">
                        <span class="step-number">1</span>
                        <span class="step-label">Category</span>
                    </div>
                    <div class="wizard-step" data-step="2">
                        <span class="step-number">2</span>
                        <span class="step-label">Service</span>
                    </div>
                    <div class="wizard-step" data-step="3">
                        <span class="step-number">3</span>
                        <span class="step-label">Configure</span>
                    </div>
                </div>
                <div class="modal-body" id="addServiceBody">
                    <!-- Step 1: Category Selection -->
                    <div class="wizard-content" id="wizardStep1">
                        <p class="wizard-instruction">Select a service category:</p>
                        <div class="category-list" id="categoryList">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                    <!-- Step 2: Service Selection -->
                    <div class="wizard-content" id="wizardStep2" style="display: none;">
                        <p class="wizard-instruction">Select a service to install:</p>
                        <div class="available-services-list" id="serviceList">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                    <!-- Step 3: Configuration -->
                    <div class="wizard-content" id="wizardStep3" style="display: none;">
                        <div id="configForm">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer wizard-footer">
                    <button class="btn btn-secondary" id="wizardBackBtn" onclick="wizardBack()" style="display: none;">Back</button>
                    <button class="btn btn-secondary" onclick="closeAddServiceModal()">Cancel</button>
                    <button class="btn btn-primary" id="wizardNextBtn" onclick="wizardNext()" style="display: none;">Next</button>
                    <button class="btn btn-primary" id="wizardInstallBtn" onclick="wizardInstall()" style="display: none;">Install</button>
                </div>
            </div>
        </div>

        <!-- Logs Modal -->
        <div id="logsModal" class="modal">
            <div class="modal-content logs-modal">
                <div class="modal-header">
                    <h2 id="logsTitle">Service Logs</h2>
                    <span class="close" onclick="closeLogsModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <pre id="logsContent" class="logs-content"></pre>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeLogsModal()">Close</button>
                    <button class="btn btn-primary" onclick="refreshLogs()">Refresh</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
