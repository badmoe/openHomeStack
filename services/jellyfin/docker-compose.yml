services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096/tcp"
      # HTTPS port (optional)
      # - "8920:8920/tcp"
      # Service discovery ports (optional)
      # - "1900:1900/udp"
      # - "7359:7359/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      # Jellyfin configuration and metadata
      - /home/containers/jellyfin/config:/config
      # Cache directory
      - /home/containers/jellyfin/cache:/cache
      # Media library - organized by type
      - /home/containers/jellyfin/media/movies:/movies
      - /home/containers/jellyfin/media/tv:/tv
      - /home/containers/jellyfin/media/music:/music
    restart: unless-stopped
    # Uncomment the devices section below to enable hardware transcoding (Intel QuickSync/VAAPI)
    # Requires /dev/dri to exist on your system (GPU with hardware encoding support)
    # devices:
    #   - /dev/dri:/dev/dri
    labels:
      # Metadata for openHomeStack dashboard
      - "openhomestack.service=jellyfin"
      - "openhomestack.name=Jellyfin"
      - "openhomestack.description=Free and open-source media streaming server"
      - "openhomestack.icon=film"
      - "openhomestack.category=media"
      - "openhomestack.url=http://localhost:8096"
